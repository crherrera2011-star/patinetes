<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Ilustración de un patinete eléctrico urbano">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17201c"/>
      <stop offset="0.55" stop-color="#101614"/>
      <stop offset="1" stop-color="#0b100e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#9dbb2f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9dbb2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#0d6b57" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0d6b57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3e6"/>
      <stop offset="0.5" stop-color="#b9c7ae"/>
      <stop offset="1" stop-color="#7d8c74"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9dbb2f"/>
      <stop offset="1" stop-color="#c8e05a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 160H1200M0 320H1200M0 480H1200M0 640H1200"/>
    <path d="M160 0V800M320 0V800M480 0V800M640 0V800M800 0V800M960 0V800M1120 0V800"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="600" cy="690" rx="360" ry="26" fill="#000000" opacity="0.45"/>

  <!-- speed lines -->
  <g stroke="url(#lime)" stroke-linecap="round" opacity="0.55">
    <path d="M170 470h130" stroke-width="4"/>
    <path d="M130 510h90" stroke-width="3"/>
    <path d="M205 550h70" stroke-width="2.5"/>
  </g>

  <!-- rear wheel -->
  <g>
    <circle cx="360" cy="620" r="78" fill="#0c1210" stroke="#2c3a33" stroke-width="10"/>
    <circle cx="360" cy="620" r="54" fill="none" stroke="url(#metal)" stroke-width="5" opacity="0.8"/>
    <circle cx="360" cy="620" r="12" fill="#9dbb2f"/>
    <g stroke="#8fa08a" stroke-width="3" opacity="0.55">
      <path d="M360 566v108M306 620h108M322 582l76 76M398 582l-76 76"/>
    </g>
  </g>

  <!-- front wheel -->
  <g>
    <circle cx="850" cy="620" r="78" fill="#0c1210" stroke="#2c3a33" stroke-width="10"/>
    <circle cx="850" cy="620" r="54" fill="none" stroke="url(#metal)" stroke-width="5" opacity="0.8"/>
    <circle cx="850" cy="620" r="12" fill="#9dbb2f"/>
    <g stroke="#8fa08a" stroke-width="3" opacity="0.55">
      <path d="M850 566v108M796 620h108M812 582l76 76M888 582l-76 76"/>
    </g>
  </g>

  <!-- deck -->
  <path d="M402 596h372l34 30H382z" fill="#1b2420" stroke="#3a4a41" stroke-width="4"/>
  <path d="M420 592h330" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- rear fender -->
  <path d="M300 604a78 78 0 0 1 118-66" fill="none" stroke="#46584d" stroke-width="10" stroke-linecap="round"/>

  <!-- front fork -->
  <path d="M812 600l30-160" stroke="url(#metal)" stroke-width="14" stroke-linecap="round"/>
  <path d="M842 440l18-96" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>

  <!-- stem -->
  <path d="M860 344L742 344" stroke="#46584d" stroke-width="16" stroke-linecap="round"/>

  <!-- handlebar -->
  <path d="M742 344c-22 0-42-14-46-34" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
  <path d="M696 310l-34-8" stroke="#9dbb2f" stroke-width="12" stroke-linecap="round"/>
  <circle cx="860" cy="344" r="10" fill="#9dbb2f"/>

  <!-- display -->
  <rect x="806" y="300" width="44" height="28" rx="7" fill="#0c1210" stroke="#3a4a41" stroke-width="3"/>
  <rect x="813" y="307" width="30" height="14" rx="3" fill="#9dbb2f" opacity="0.85"/>

  <!-- battery pack -->
  <rect x="470" y="558" width="150" height="26" rx="8" fill="#0c1210" stroke="#3a4a41" stroke-width="3"/>
  <g fill="#9dbb2f">
    <rect x="484" y="566" width="12" height="10" rx="2"/>
    <rect x="502" y="566" width="12" height="10" rx="2"/>
    <rect x="520" y="566" width="12" height="10" rx="2"/>
    <rect x="538" y="566" width="12" height="10" rx="2"/>
  </g>

  <!-- headlight -->
  <circle cx="880" cy="470" r="16" fill="#c8e05a" opacity="0.9"/>
  <circle cx="880" cy="470" r="30" fill="#c8e05a" opacity="0.16"/>
  <path d="M910 470l120-40v80z" fill="#c8e05a" opacity="0.12"/>

  <!-- rear light -->
  <circle cx="296" cy="590" r="9" fill="#b0473f"/>
</svg>
